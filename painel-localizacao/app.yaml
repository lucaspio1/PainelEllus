# Configuração para Google App Engine
runtime: nodejs18

# Configurações de instância
instance_class: F1

# Escalabilidade automática
automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.65

# Variáveis de ambiente
# ⚠️ IMPORTANTE: Configure as credenciais via Console do Cloud Run
# ⚠️ NÃO adicione FIREBASE_PRIVATE_KEY aqui - use o console do GCP
env_variables:
  # Firebase/GCP Project ID
  GCP_PROJECT: "embarqueellus"
  FIREBASE_PROJECT_ID: "embarqueellus"

# Handlers (opcional - otimização)
handlers:
  # Servir arquivos estáticos diretamente
  - url: /public
    static_dir: public
    secure: always

  # Todas as outras rotas vão para o Node.js
  - url: /.*
    script: auto
    secure: always
