# Configuração para Google App Engine
runtime: nodejs18

# Configurações de instância
instance_class: F1

# Escalabilidade automática
automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.65

# Variáveis de ambiente
# ⚠️ Usando Application Default Credentials (ADC) - Recomendado para GCP
env_variables:
  # Firebase/GCP Project ID (obtido do deployment)
  GCP_PROJECT: "embarquellus-build"
  FIREBASE_PROJECT_ID: "embarquellus-build"

# Handlers (opcional - otimização)
handlers:
  # Servir arquivos estáticos diretamente
  - url: /public
    static_dir: public
    secure: always

  # Todas as outras rotas vão para o Node.js
  - url: /.*
    script: auto
    secure: always
