<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Painel Ellus</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-body"> <!-- Garante o fundo e centralização -->

  <div class="login-card">
    <img src="icon.png" alt="Ellus Turismo" class="login-logo">
    <h2 class="login-title">Acesso Restrito</h2>
    
    <form id="loginForm">
      <div class="input-group">
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input type="text" id="cpf" class="form-input-login" placeholder="CPF" required>
        </div>
      </div>
      
      <div class="input-group">
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="senha" class="form-input-login" placeholder="Senha" required>
        </div>
      </div>

      <button type="submit" class="btn-login">
        <span id="btnText">ENTRAR</span>
        <div id="loader" class="loader"></div>
      </button>
      
      <p id="errorMsg" class="error-msg">Credenciais inválidas.</p>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const cpf = document.getElementById('cpf').value.replace(/\D/g, ''); 
      const senha = document.getElementById('senha').value;
      const btnText = document.getElementById('btnText');
      const loader = document.getElementById('loader');
      const errorMsg = document.getElementById('errorMsg');

      // UI Loading
      btnText.style.display = 'none';
      loader.style.display = 'block';
      errorMsg.style.display = 'none';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cpf, senha })
        });

        const data = await response.json();

        // LÓGICA ROBUSTA: Tenta pegar o usuário onde quer que ele esteja
        // data.user = Servidor Novo Simplificado
        // data.data.user = Servidor Antigo ou Estrutura aninhada
        const usuario = data.user || (data.data && data.data.user);

        if (data.success && usuario) {
            // Verifica perfil se necessário
            if(usuario.perfil === 'ADMIN' || true) { // "|| true" remove a trava de admin se quiser liberar geral
                localStorage.setItem('painel_user', JSON.stringify(usuario));
                window.location.href = '/home';
            } else {
                 throw new Error('Usuário sem permissão de acesso.');
            }
        } else {
            throw new Error(data.message || 'CPF ou senha incorretos.');
        }

      } catch (error) {
        console.error(error);
        errorMsg.textContent = error.message || 'Erro desconhecido.';
        errorMsg.style.display = 'block';
      } finally {
        btnText.style.display = 'block';
        loader.style.display = 'none';
      }
    });

    // Mascara CPF (Digitação amigável)
    document.getElementById('cpf').addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
      else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{3})/, '$1.$2.$3');
      else if (v.length > 3) v = v.replace(/(\d{3})(\d{3})/, '$1.$2');
      e.target.value = v;
    });
  </script>
</body>
</html>
