<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Usuários - Ellus</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .usuarios-container { max-width: 1200px; margin: 20px auto; padding: 20px; }
    .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .users-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .users-table th { background: var(--brand-dark-green); color: white; padding: 12px; text-align: left; font-weight: 600; }
    .users-table td { padding: 12px; border-bottom: 1px solid #eee; }
    .users-table tr:hover { background: #f9f9f9; }
    .badge-ativo { background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; }
    .badge-inativo { background: #fee2e2; color: #b91c1c; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; }
    .badge-perfil { background: #dbeafe; color: #1e40af; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; }
    .btn-icon { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 5px 10px; transition: color 0.2s; }
    .btn-icon.edit { color: #2563eb; }
    .btn-icon.delete { color: #dc2626; }
    .btn-icon:hover { opacity: 0.7; }
    .form-modal { background: white; border-radius: 12px; padding: 30px; max-width: 500px; width: 90%; }
    .form-modal h3 { margin-bottom: 20px; color: var(--brand-dark-green); }
    .form-row { margin-bottom: 15px; }
    .form-row label { display: block; font-weight: 600; margin-bottom: 5px; color: #555; font-size: 0.9rem; }
    .form-row input, .form-row select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px; }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="logo-area">
      <img src="icon.png" alt="Ellus" class="logo-img">
      <span style="font-weight:bold; margin-left:10px; color:var(--brand-dark-green)">Gerenciar Usuários</span>
    </div>
    <div>
      <a href="/home" class="btn btn-sm btn-outline"><i class="fas fa-home"></i> Voltar</a>
    </div>
  </header>

  <div class="usuarios-container">
    <div class="header-actions">
      <h2><i class="fas fa-users"></i> Usuários do Sistema</h2>
      <button class="btn btn-primary" onclick="abrirModalNovo()">
        <i class="fas fa-user-plus"></i> Novo Usuário
      </button>
    </div>

    <div id="loadingUsuarios" class="loading-spinner hidden">
      <i class="fas fa-spinner fa-spin"></i> Carregando...
    </div>

    <table class="users-table" id="tabelaUsuarios">
      <thead>
        <tr>
          <th>Nome</th>
          <th>CPF</th>
          <th>Perfil</th>
          <th>Status</th>
          <th style="text-align:center">Ações</th>
        </tr>
      </thead>
      <tbody id="usuariosBody">
        <tr><td colspan="5" style="text-align:center; padding: 40px;">Carregando usuários...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Modal para Criar/Editar Usuário -->
  <div id="modalUsuario" class="modal-overlay" style="display: none;">
    <div class="form-modal">
      <h3 id="modalTitle">Novo Usuário</h3>
      <form id="formUsuario" onsubmit="salvarUsuario(event)">
        <input type="hidden" id="usuarioId">

        <div class="form-row">
          <label>Nome Completo *</label>
          <input type="text" id="inputNome" required>
        </div>

        <div class="form-row">
          <label>CPF *</label>
          <input type="text" id="inputCpf" maxlength="14" placeholder="000.000.000-00" required>
        </div>

        <div class="form-row">
          <label>Senha *</label>
          <input type="password" id="inputSenha" placeholder="Mínimo 4 caracteres" required>
        </div>

        <div class="form-row">
          <label>Perfil *</label>
          <select id="inputPerfil" required>
            <option value="USER">Usuário</option>
            <option value="ADMIN">Administrador</option>
          </select>
        </div>

        <div class="form-row">
          <label>Status *</label>
          <select id="inputAtivo" required>
            <option value="true">Ativo</option>
            <option value="false">Inativo</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Salvar
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p id="loadingText">Processando...</p>
  </div>

  <script src="usuarios.js"></script>
</body>
</html>
