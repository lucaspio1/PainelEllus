<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Quartos - Ellus</title>
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <div class="logo-area" onclick="window.location.href='/home'">
        <i class="fas fa-arrow-left"></i> Voltar
      </div>
      <div style="flex:1; text-align:center; font-weight:700; color:var(--brand-dark-green);">
        <i class="fas fa-bed"></i> Controle de Quartos
      </div>
      <div class="controls-area">
        <small id="ultimaAtualizacao" class="muted">Atualizando...</small>
        <button id="btnAtualizar" class="btn btn-outline btn-sm" title="Atualizar (F5)"><i class="fas fa-sync-alt"></i> Atualizar</button>
        <button id="btnExportar" class="btn btn-outline btn-sm" title="Baixar lista filtrada (Excel/CSV)"><i class="fas fa-file-csv"></i> Exportar</button>
        <button id="btnToggleView" class="btn btn-primary btn-sm"><i class="fas fa-th"></i> Ver por quarto</button>
      </div>
      <div class="operator-area"><span id="nomeOperadorDisplay" class="operator-name">Olá</span></div>
    </header>

    <section class="filters-bar">
      <div class="filter-field">
        <label for="filtroViagem">Viagem</label>
        <select id="filtroViagem" class="form-select"><option value="">Todas as viagens</option></select>
      </div>
      <div class="filter-field">
        <label for="filtroColegio">Colégio</label>
        <select id="filtroColegio" class="form-select"><option value="">Todos os colégios</option></select>
      </div>
      <div class="filter-field grow">
        <label for="inputPesquisa">Buscar</label>
        <input type="text" id="inputPesquisa" class="form-input" placeholder="Nome, CPF ou nº do quarto">
      </div>
      <div class="filter-field">
        <label>Mostrar</label>
        <div class="chips" id="chipsStatus">
          <button class="chip active" data-valor="">Todos <span class="count" id="cntTodos">0</span></button>
          <button class="chip" data-valor="quarto">🛌 No quarto <span class="count" id="cntQuarto">0</span></button>
          <button class="chip" data-valor="fora">🚶 Fora <span class="count" id="cntFora">0</span></button>
          <button class="chip" data-valor="balada">🎉 Balada <span class="count" id="cntBalada">0</span></button>
          <button class="chip" data-valor="alerta" title="No quarto há mais tempo que o limite (contagem das 08h às 00h)">⏰ No quarto há muito tempo <span class="count" id="cntAlerta">0</span></button>
        </div>
      </div>
      <div class="filter-field" style="min-width:110px">
        <label for="limiteMin" title="Contagem das 08h às 00h">No quarto há mais de</label>
        <select id="limiteMin" class="form-select">
          <option value="30">30 min</option>
          <option value="60">1 hora</option>
          <option value="120">2 horas</option>
          <option value="180">3 horas</option>
        </select>
      </div>
    </section>

    <main class="main-content">
      <div id="viewStatus" class="view-columns">
        <div class="column col-quarto">
          <div class="col-header"><h2><i class="fas fa-bed"></i> No Quarto</h2><span class="badge-count" id="countQuarto">0</span></div>
          <div class="col-body" id="listaQuarto"></div>
        </div>
        <div class="column col-fora">
          <div class="col-header"><h2><i class="fas fa-walking"></i> Fora</h2><span class="badge-count" id="countFora">0</span></div>
          <div class="col-body" id="listaFora"></div>
        </div>
        <div class="column col-balada">
          <div class="col-header"><h2><i class="fas fa-music"></i> Balada</h2><span class="badge-count" id="countBalada">0</span></div>
          <div class="col-body" id="listaBalada"></div>
        </div>
      </div>
      <div id="viewQuartos" class="view-grid hidden"></div>
    </main>
  </div>

  <div id="modalDetalhes" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header"><h3>Detalhes do aluno</h3><button class="btn-close" onclick="fecharModal()">&times;</button></div>
      <div class="modal-body">
        <h2 id="detalheNome">--</h2>
        <div style="margin:6px 0 10px"><span id="detalheStatus" class="badge">--</span> <span id="detalheTempo" class="muted"></span></div>
        <div class="profile-info">
          <p><strong>CPF:</strong> <span id="detalheCpf">--</span></p>
          <p><strong>Quarto:</strong> <span id="detalheQuarto">--</span></p>
          <p><strong>Colégio:</strong> <span id="detalheInfo">--</span></p>
          <p><strong>Facial:</strong> <span id="detalheFacial">--</span></p>
        </div>
        <div class="quick-actions"><p style="margin-top:12px"><strong>Mover para:</strong></p><div class="btn-group"><button class="btn btn-sm btn-green" onclick="moverNoModal('VOLTOU_AO_QUARTO')">🛌 Quarto</button><button class="btn btn-sm btn-orange" onclick="moverNoModal('SAIU_DO_QUARTO')">🚶 Fora</button><button class="btn btn-sm btn-purple" onclick="moverNoModal('FOI_PARA_BALADA')">🎉 Balada</button></div></div>
        <div class="history-section" style="margin-top:16px"><h4>Histórico</h4><div id="listaHistorico" class="history-list"></div></div>
      </div>
    </div>
  </div>
  <div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div><p>Carregando...</p></div>
  <div id="toastContainer" class="toast-container"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="common.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
